# Запуск с нуля:  docker compose up --build
# Кабинет: http://localhost:8080   API и Swagger: http://localhost:8000/docs
# LLM (необязательно, ~5 ГБ):  docker compose --profile llm up --build
name: alfa-credit

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://credit:credit@db:5432/credit
  JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
  DEMO_SIGN_CODE: ${DEMO_SIGN_CODE:-0000}
  DEMO_TODAY: ${DEMO_TODAY:-2026-10-22}
  MOCKS_URL: http://mocks:8100
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: credit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: alfa-credit-backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: alfa-credit-backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy  # миграции и сид выполняет api при старте
    restart: unless-stopped

  mocks:
    image: alfa-credit-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: ["uvicorn", "mocks.app:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "8100:8100"  # Swagger моков и переключатель сбоев: http://localhost:8100/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:0.6.8
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  ollama-pull:
    profiles: ["llm"]
    image: ollama/ollama:0.6.8
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}"]
    restart: "no"

volumes:
  pgdata:
  ollama:
