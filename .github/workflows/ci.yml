name: ci

# Every pushed commit on every branch and every pull request gets the same gates.
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: credit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/credit_test
      DEMO_TODAY: "2026-10-22"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Ruff
        run: cd backend && ruff check .
      - name: Tests, including frozen scoring cases
        run: cd backend && python -m pytest -q

  reference:
    name: Frozen reference data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: Check every generated field against expected.json
        run: |
          python data/reference/engine.py data/rules.yaml data/personas --json /tmp/credit-expected.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path('data/reference/expected.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('/tmp/credit-expected.json').read_text(encoding='utf-8'))
          assert actual == expected, 'Reference output differs from expected.json'
          assert all(item['match'] for item in actual.values()), 'At least one persona misses its expected outcome'
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend package
        id: frontend_files
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.frontend_files.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.frontend_files.outputs.present == 'true'
        working-directory: frontend
      - run: npm run build
        if: steps.frontend_files.outputs.present == 'true'
        working-directory: frontend

  compose:
    name: docker compose up from scratch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through nginx (client login, bank login, worker alive)
        run: |
          set -e
          curl -fsS http://localhost:8080/ | grep -qi "<div id=\"root\""
          curl -fsS http://localhost:8080/health
          for who in p3b uw1; do
            curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -d "{\"login\":\"$who\",\"password\":\"demo\"}" | grep -q access_token
          done
          curl -fsS http://localhost:8100/health | grep -q '"personas":7'
          test "$(docker compose ps worker --format '{{.State}}')" = running
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies for the browser test
        run: npm ci
        working-directory: frontend
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end test in the browser (p3b from login to issued overdraft, underwriter queue, refusal)
        run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/.out/report
            frontend/e2e/.out/results
          retention-days: 7
          include-hidden-files: true
      - name: Restart keeps data (seed is idempotent)
        run: |
          docker compose restart api
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://localhost:8000/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - run: docker compose down -v
        if: always()
